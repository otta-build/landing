<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#3F2FB8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <!-- open orbit arc (continuous delivery loop): ~290°, gap at top -->
  <path d="M 512 250
           A 262 262 0 1 1 304 360"
        fill="none" stroke="#FFFFFF" stroke-width="86" stroke-linecap="round"/>
  <!-- leading agent node at the arc head (top) -->
  <circle cx="512" cy="250" r="70" fill="#FFFFFF"/>
</svg>
