name: Deploy

# Single source of truth for otta.build. The site deploys to Cloudflare Pages
# ONLY from main, via this workflow. Do not run `wrangler pages deploy`
# manually — a shared Pages API token can write EVERY project in the account,
# and a manual deploy has previously clobbered otta.build and dataforgtm.ai.
# Push to main (or dispatch) instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy otta.build
    # GitHub-hosted. This repo is PUBLIC, so hosted minutes are free — which is
    # why the site was extracted here rather than staying in otta-build/dev,
    # where a private repo in a free org forced everything onto the single
    # self-hosted Hetzner runner. Deploying no longer queues behind the
    # ~19-minute cockpit build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Astro requires Node >=22.12; the self-hosted runner ships Node 18.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Direct bunx rather than wrangler-action: the action's `npm i wrangler`
      # errors in a bun.lock-only repo (npm arborist "edgesOut").
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name otta --branch main
