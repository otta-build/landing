name: Deploy otta.build

# otta.build deploys to Cloudflare Pages from this repo's main branch.
# Runs on ubuntu-latest: this repo is public, so GitHub-hosted minutes are free
# and builds no longer queue behind otta-build/dev's single self-hosted runner
# (where a landing deploy sat behind a ~19-minute Tauri build).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy otta.build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Astro requires Node >= 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bunx astro build

      # otta-build/landing#16: stamps dist/build-info.json with this build's
      # commit SHA, served at otta.build/build-info.json, so
      # otta-deploy-verify.sh's merge-and-deploy SHA-match check has something
      # to verify the deploy against instead of nothing (deploy.yml previously
      # had no endpoint reporting the deployed commit at all).
      - name: Write build-info artifact
        run: bun scripts/write-build-info.mjs

      # otta-build/landing#16: neither workflow runs this file today —
      # ci.yml (out of scope here, owned by #15) and this workflow both invoke
      # a single named test file rather than a glob. Running it here means a
      # missing/malformed artifact fails the deploy instead of shipping
      # unverifiable; see .pr-body.md for the still-open PR-time gap.
      - name: Verify build-info artifact
        run: bun test tests/build-info.test.ts

      # otta-build/dev#92: a syntax error in the PostHog snippet silently killed
      # analytics for 90 days — every capture call is `window.posthog?.capture(...)`,
      # so with posthog undefined they all no-op and a broken pipeline looks
      # exactly like a dead site. Fail the deploy instead of losing the data.
      - name: Verify built inline scripts parse
        run: bun test tests/inline-script-syntax.test.ts

      # otta-build/landing#2: the Pages project also has a GitHub source, so a
      # push to main used to trigger a SECOND production build inside
      # Cloudflare — racing this one 37 seconds apart, last writer winning. That
      # path does not run the syntax guard above, so it could ship the exact
      # snippet dev#92 cost 90 days of analytics to. Git-integration deploys are
      # switched off; this fails the run if anyone turns them back on, because
      # the symptom otherwise is an occasional unguarded deploy nobody sees.
      - name: Verify Cloudflare git integration stays disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="$(curl -sf \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/otta" \
            | jq -c '.result.source.config // {}')"
          enabled="$(printf '%s' "$config" | jq -r '.deployments_enabled')"
          prod="$(printf '%s' "$config" | jq -r '.production_deployments_enabled')"
          if [ "$enabled" = "true" ] || [ "$prod" = "true" ]; then
            echo "::error::Cloudflare git-integration deploys are enabled for project 'otta'." >&2
            echo "Two production deploy paths would race, and the git build skips this workflow's syntax guard." >&2
            echo "Disable them in Pages → Settings → Builds & deployments, or via the API." >&2
            exit 1
          fi
          echo "✓ git-integration deploys disabled (deployments_enabled=$enabled, production=$prod)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name otta --branch main
