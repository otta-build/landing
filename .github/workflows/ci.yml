name: CI

# Merging to main deploys otta.build to production, so a PR that has never been
# built is a production change nobody compiled. Until this existed the only
# build ran AFTER merge, and the Otta Gate sat neutral forever ("CI status
# unknown") because no PR check ever reported.
#
# Public repo → GitHub-hosted minutes are free, same as deploy.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Astro requires Node >= 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bunx astro build

      # Mirrors deploy.yml: a syntax error in an inline script silently kills
      # analytics (otta-build/dev#92). Catch it on the PR, not after merge.
      - name: Verify built output and delivery contracts
        run: bun test

      - name: Verify Otta deployment readiness
        run: bash scripts/verify-otta-deploy-readiness.sh
